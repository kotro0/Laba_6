name: Java CI with Maven and Tests

on:
  push:
    branches: [ "main", "Laba_6" ]
  pull_request:
    branches: [ "main", "Laba_6" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Запускаем временную базу данных для тестов
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: conference
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Декодируем сертификат из Base64
      - name: Decode Keystore
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/server.jks
        shell: bash

      # Теперь запускаем полноценную сборку С ТЕСТАМИ
      - name: Build and Test with Maven
        run: mvn clean package
        env:
          # Указываем приложению, как подключиться к временной базе на GitHub
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/conference
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: conference-app-build
          path: target/*.jar